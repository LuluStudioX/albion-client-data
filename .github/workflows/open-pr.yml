name: open-pr

# The box pushes `updates-<version>` and stops there. It holds a DEPLOY KEY, which can do git
# and nothing else - no API, so it cannot open a pull request, which is the point. A leaked
# publish credential has to mean "someone can push data that is already public", never
# "someone can act as us on GitHub".
#
# So the repository opens its own pull request, with the built-in GITHUB_TOKEN, and turns on
# auto-merge. Nobody has to act for a good publish to land; nothing lands if `validate` is red.
on:
  push:
    branches: ["updates-**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    name: open the pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Open it, or reuse the one that is already open
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        # NEVER let this job fail.
        #
        # A red check run - any red check run, required or not - leaves the pull request in
        # GitHub's UNSTABLE state, and auto-merge only fires on CLEAN. So a failure here does
        # not merely skip opening the PR: it deadlocks the merge of a publish that `validate`
        # has already passed. This job arranges the merge; it must never become the reason the
        # merge cannot happen. It says loudly what went wrong and exits 0.
        continue-on-error: true
        run: |
          set -uo pipefail
          version=$(tr -d '[:space:]' < VERSION)

          # `gh pr create` prints the PR URL and has no --json; `gh pr merge` takes that URL
          # as happily as a number, so the URL is what travels between the two.
          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$url" ]; then
            echo "reusing the pull request already open for $BRANCH: $url"
          else
            {
              git log -1 --pretty=%b
              echo
              echo "Opened automatically by \`open-pr.yml\`. The \`validate\` check re-derives"
              echo "every hash from the committed bytes; auto-merge lands this the moment that"
              echo "is green, and never if it is red."
            } > /tmp/pr-body.md
            url=$(gh pr create --base main --head "$BRANCH" \
              --title "client $version" --body-file /tmp/pr-body.md) || url=""
            if [ -z "$url" ]; then
              echo "::warning::Could not open the pull request. If the message above says"
              echo "::warning::'GitHub Actions is not permitted to create or approve pull"
              echo "::warning::requests', that is an ORGANISATION setting, not a bug here:"
              echo "::warning::Settings > Actions > General > Workflow permissions. Until it"
              echo "::warning::is on, open the PR by hand for branch $BRANCH - validate has"
              echo "::warning::already checked the bytes and still gates the merge."
              exit 0
            fi
            echo "opened $url"
          fi

          # Auto-merge is a request, not a merge: GitHub performs it once the required check
          # passes. It fails loudly if branch protection or the repo setting is missing, which
          # is the failure we want to see rather than a silent direct merge.
          #
          # Squash, not a merge commit. `main` requires linear history so that one client build
          # is one commit: `git diff v1.32.010 v1.32.020` then means exactly what it looks like,
          # and bisecting a data regression walks builds rather than merge bubbles.
          if gh pr merge "$url" --auto --squash; then
            echo "auto-merge armed on $url"
          else
            echo "::warning::Could not arm auto-merge on $url - merge it by hand once validate"
            echo "::warning::is green. Check that 'Allow auto-merge' is on and that main is"
            echo "::warning::protected with validate as a required check."
          fi
